<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DOBÊ — Streetwear · Drop 02</title>
<link rel="icon" type="image/png" href="assets/logo.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@300;400;500;600;700;800;900&family=Archivo+Narrow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
/* DOBÊ — streetwear premium */

:root {
  --bg: #0a0a0a;
  --bg-2: #111111;
  --bg-3: #161616;
  --fg: #f4f4f2;
  --fg-dim: #8a8a8a;
  --fg-dimmer: #555555;
  --line: #1f1f1f;
  --line-2: #2a2a2a;
  --accent: #e1251b;
  --silver: #cfcfd1;
  --ok: #6cdf7a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(255,255,255,0.03), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(225,37,27,0.04), transparent 60%),
    var(--bg);
}

img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }

::selection { background: var(--accent); color: #fff; }

.mono {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
}
.label {
  font-family: "Archivo", sans-serif;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--fg-dim);
}

.wrap { max-width: 1680px; margin: 0 auto; padding: 0 28px; }
@media (max-width: 720px) { .wrap { padding: 0 16px; } }

/* ============ MARQUEE ============ */

.marquee {
  position: relative;
  overflow: hidden;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  height: 30px;
  display: flex;
  align-items: center;
}
.marquee-track {
  display: flex;
  gap: 56px;
  white-space: nowrap;
  animation: marquee 38s linear infinite;
  padding-left: 28px;
}
.marquee span {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-dim);
}
.marquee span b { color: var(--fg); font-weight: 500; }
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ============ NAV ============ */

.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10,10,10,0.72);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  height: 72px;
  gap: 12px;
}
.nav-side { display: flex; align-items: center; }
.nav-side.left { justify-content: flex-start; }
.nav-side.right { justify-content: flex-end; }

.nav-logo {
  display: inline-flex; align-items: center; gap: 12px;
  font-family: "Anton", sans-serif;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 24px;
  perspective: 600px;
  user-select: none;
}
.nav-logo-img {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  animation: logoFloat 9s ease-in-out infinite;
  will-change: transform;
}
.nav-logo-img img {
  width: 100%; height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 0 0.5px rgba(255,255,255,0.4));
  transition: filter 0.6s ease;
}
.nav-logo-img::before {
  content: "";
  position: absolute; inset: -10px;
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18), rgba(255,255,255,0) 65%);
  opacity: 0.35;
  filter: blur(8px);
  pointer-events: none;
  transition: opacity 0.5s ease, transform 0.6s ease;
  z-index: -1;
}
.nav-logo-text {
  position: relative;
  transition: letter-spacing 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.nav-logo:hover .nav-logo-img { transform: rotateY(18deg) rotateX(-6deg) scale(1.08); }
.nav-logo:hover .nav-logo-img img { filter: drop-shadow(0 0 0.5px rgba(255,255,255,0.6)) drop-shadow(0 0 14px rgba(255,255,255,0.35)); }
.nav-logo:hover .nav-logo-img::before { opacity: 0.7; transform: scale(1.15); }
.nav-logo:hover .nav-logo-text { letter-spacing: 0.12em; }

@keyframes logoFloat {
  0%, 100% { transform: rotateY(0deg) rotateX(0deg); }
  50%       { transform: rotateY(12deg) rotateX(-3deg); }
}
@media (prefers-reduced-motion: reduce) {
  .nav-logo-img { animation: none; }
  .nav-logo:hover .nav-logo-img { transform: none; }
}

.nav-icon {
  position: relative;
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: color 0.2s ease;
  color: var(--fg);
}
.nav-icon:hover { color: var(--accent); }
.nav-cart-count {
  position: absolute; top: 4px; right: 4px;
  min-width: 14px; height: 14px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 4px;
  background: var(--accent); color: #fff;
  font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 600;
  transform: scale(0);
  transition: transform 0.25s cubic-bezier(0.5, 1.5, 0.5, 1);
}
.nav-cart-count.on { transform: scale(1); }

.burger {
  display: flex; width: 40px; height: 40px;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 5px; transition: gap 0.25s ease;
}
.burger:hover { gap: 7px; }
.burger span {
  display: block; width: 22px; height: 1.5px; background: var(--fg);
  transition: transform 0.3s ease, opacity 0.2s ease, width 0.3s ease;
}
.burger:hover span:nth-child(2) { width: 14px; }

@media (max-width: 720px) {
  .nav-inner { height: 60px; }
  .nav-logo { font-size: 20px; gap: 10px; }
  .nav-logo-img { width: 30px; height: 30px; }
}

/* ============ MOBILE MENU ============ */

.mobile-menu {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 100;
  display: flex; flex-direction: column;
  transform: translateY(-100%);
  transition: transform 0.5s cubic-bezier(0.7, 0, 0.2, 1);
}
.mobile-menu.open { transform: translateY(0); }
.mobile-menu-head {
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}
.mobile-menu-head .nav-logo img {
  width: 28px; height: 28px; object-fit: contain; flex-shrink: 0;
}
.mobile-menu-list {
  flex: 1; display: flex; flex-direction: column;
  padding: 24px 16px; gap: 4px; overflow: auto;
}
.mobile-menu-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 4px;
  border-bottom: 1px solid var(--line);
  font-family: "Anton", sans-serif;
  font-size: 42px; text-transform: uppercase; letter-spacing: 0.01em;
}
.mobile-menu-item .num {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--fg-dim); letter-spacing: 0.12em;
}
.mobile-menu-foot {
  padding: 20px 16px 32px;
  border-top: 1px solid var(--line);
  display: grid; gap: 12px;
}
.mobile-menu-foot .row {
  display: flex; gap: 16px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; letter-spacing: 0.12em;
  color: var(--fg-dim); text-transform: uppercase;
}
.mobile-menu-foot .row a { color: var(--fg); }

/* ============ HERO ============ */

.hero {
  position: relative;
  padding: 32px 0 64px;
  min-height: calc(100vh - 94px);
  display: flex; flex-direction: column;
}
.hero-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 0.7fr 1.3fr;
  gap: 40px;
  align-items: stretch;
}
.hero-left {
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 24px 0 32px;
}
.hero-eyebrow {
  display: flex; gap: 12px; align-items: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--fg-dim);
}
.hero-eyebrow .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

.hero-logo-large {
  margin: 28px 0 0;
  flex: 1;
  display: flex;
  align-items: center;
}
.hero-logo-large img {
  width: clamp(140px, 18vw, 260px);
  height: auto;
  display: block;
  filter: drop-shadow(0 0 24px rgba(255,255,255,0.12));
}

.hero-sub {
  margin-top: 0;
  max-width: 480px;
}
.hero-sub p { font-size: 16px; line-height: 1.65; color: var(--fg-dim); }
.hero-sub p b { color: var(--fg); font-weight: 600; }

.hero-cta {
  margin-top: 32px;
  display: flex; flex-wrap: wrap; gap: 12px;
}

.btn {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 14px 22px;
  font-family: "Archivo", sans-serif; font-weight: 700;
  font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  border: 1px solid var(--fg);
  transition: all 0.22s ease;
  cursor: pointer; background: transparent; color: var(--fg);
}
.btn .arrow { transition: transform 0.22s ease; }
.btn:hover { background: var(--fg); color: var(--bg); }
.btn:hover .arrow { transform: translateX(4px); }
.btn-primary { background: var(--fg); color: var(--bg); }
.btn-primary:hover { background: var(--accent); color: var(--fg); border-color: var(--accent); }
.btn-ghost { border-color: var(--line-2); color: var(--fg-dim); }
.btn-ghost:hover { background: transparent; color: var(--fg); border-color: var(--fg); }

.hero-right { position: relative; display: flex; align-items: stretch; }
.hero-image { position: relative; flex: 1; background: var(--bg-2); overflow: hidden; }
.hero-image img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center;
  filter: contrast(1.05) saturate(0.95);
  transition: transform 8s ease-out;
}
.hero-image:hover img { transform: scale(1.04); }
.hero-image-meta {
  position: absolute; left: 16px; bottom: 16px; right: 16px;
  display: flex; justify-content: space-between; align-items: flex-end;
  pointer-events: none;
}
.hero-image-meta .tag {
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  padding: 8px 12px;
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg);
}
.hero-image-meta .tag b { color: var(--accent); }

@media (max-width: 920px) {
  .hero-grid { grid-template-columns: 1fr; gap: 24px; }
  .hero-right { min-height: 65vh; }
}

/* ============ SECTION HEADER ============ */

.section-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 24px; padding: 64px 0 24px;
  border-bottom: 1px solid var(--line);
}
.section-head .left { display: flex; flex-direction: column; gap: 12px; }
.section-head h2 {
  font-family: "Anton", sans-serif;
  font-size: clamp(40px, 6vw, 96px);
  line-height: 0.86; text-transform: uppercase; letter-spacing: -0.01em;
}
.section-head h2 em { font-style: normal; color: var(--accent); }
.section-head .right { display: flex; gap: 12px; align-items: center; }

/* ============ PRODUCT GRID ============ */

.product-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px; background: var(--line); border-bottom: 1px solid var(--line);
}
.product-grid.three { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 1100px) { .product-grid, .product-grid.three { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .product-grid, .product-grid.three { grid-template-columns: 1fr; } }

.product {
  background: var(--bg); position: relative;
  display: flex; flex-direction: column;
  cursor: pointer; transition: background 0.3s ease;
}
.product:hover { background: var(--bg-2); }
.product-media {
  position: relative; aspect-ratio: 4/5;
  background: var(--bg-2); overflow: hidden;
}
.product-media img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center 12%;
  transition: transform 0.7s cubic-bezier(0.2,0.8,0.2,1), opacity 0.4s ease;
}
.product-media .alt-img-cover {
  position: absolute; inset: 0; opacity: 0;
  transition: opacity 0.5s ease, transform 0.7s cubic-bezier(0.2,0.8,0.2,1);
  object-fit: cover; object-position: center 12%;
}
.product:hover .product-media > img:first-child { transform: scale(1.04); }
.product:hover .alt-img-cover { opacity: 1; transform: scale(1.02); }

.product-flip {
  position: absolute; top: 12px; right: 12px;
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 5px 8px; background: rgba(0,0,0,0.5); color: var(--fg);
  opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
}
.product:hover .product-flip { opacity: 1; }
.product:hover .product-flip span::after { content: " · FRENTE"; }

.product-badge {
  position: absolute; top: 12px; left: 12px;
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 5px 8px; background: var(--fg); color: var(--bg);
}
.product-badge.red { background: var(--accent); color: #fff; }
.product-badge.outline { background: rgba(0,0,0,0.5); color: var(--fg); border: 1px solid var(--line-2); }

.product-quick {
  position: absolute; bottom: 12px; right: 12px;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.product:hover .product-quick { opacity: 1; transform: translateY(0); }
.product-quick button {
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  letter-spacing: 0.15em; text-transform: uppercase;
  background: var(--fg); color: var(--bg); padding: 9px 14px;
  transition: background 0.2s ease, color 0.2s ease;
}
.product-quick button:hover { background: var(--accent); color: #fff; }

.product-body { padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 6px; }
.product-meta {
  display: flex; justify-content: space-between;
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  letter-spacing: 0.14em; color: var(--fg-dim); text-transform: uppercase;
}
.product-name {
  font-family: "Archivo", sans-serif; font-weight: 700;
  font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase;
}
.product-price {
  font-family: "Archivo", sans-serif; font-weight: 600;
  font-size: 14px; letter-spacing: 0.04em; color: var(--fg);
}
.product-price s { color: var(--fg-dimmer); margin-right: 8px; font-weight: 400; }
.product-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; gap: 12px; }
.product-sizes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.product-size {
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  letter-spacing: 0.1em; padding: 3px 7px;
  border: 1px solid var(--line-2); color: var(--fg-dim);
}
.product-size.sold { color: var(--fg-dimmer); text-decoration: line-through; }

/* ============ FILTERS ============ */

.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 24px 0; }
.filter {
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 8px 14px; border: 1px solid var(--line-2);
  color: var(--fg-dim); cursor: pointer; transition: all 0.2s ease;
}
.filter:hover { color: var(--fg); border-color: var(--fg); }
.filter.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filter .count { color: var(--fg-dimmer); margin-left: 6px; }
.filter.active .count { color: rgba(0,0,0,0.5); }

/* ============ LOOKBOOK ============ */

.lookbook {
  margin-top: 80px; position: relative;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; background: var(--line);
}
@media (max-width: 920px) { .lookbook { grid-template-columns: 1fr; } }
.look-tile { position: relative; aspect-ratio: 4/5; overflow: hidden; background: var(--bg-2); }
.look-tile img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s ease; }
.look-tile:hover img { transform: scale(1.03); }
.look-tile-meta {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 28px;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.7) 100%);
  pointer-events: none;
}
.look-tile-meta .num {
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  letter-spacing: 0.18em; color: var(--fg-dim); text-transform: uppercase;
}
.look-tile-meta h3 {
  font-family: "Anton", sans-serif; font-size: clamp(28px, 4vw, 56px);
  line-height: 0.9; text-transform: uppercase; margin-top: 8px;
}

/* ============ MANIFESTO ============ */

.manifesto {
  padding: 120px 0 80px;
  display: grid; grid-template-columns: 1fr 1.5fr;
  gap: 64px; align-items: start;
}
@media (max-width: 920px) { .manifesto { grid-template-columns: 1fr; gap: 24px; padding: 64px 0 40px; } }
.manifesto-left { position: sticky; top: 100px; display: flex; flex-direction: column; gap: 24px; }
.manifesto-left .mono { color: var(--fg-dim); }
.manifesto-left h2 {
  font-family: "Anton", sans-serif;
  font-size: clamp(48px, 6.2vw, 100px);
  line-height: 0.86; text-transform: uppercase; letter-spacing: -0.01em;
}
.manifesto-left h2 em { font-style: normal; color: var(--accent); }
.manifesto-right p { font-size: 18px; line-height: 1.55; margin-bottom: 24px; color: var(--fg); }
.manifesto-right p:last-child { color: var(--fg-dim); font-size: 15px; }
.manifesto-right .pull {
  font-family: "Anton", sans-serif; font-size: clamp(32px, 4vw, 56px);
  line-height: 0.95; text-transform: uppercase;
  border-left: 3px solid var(--accent); padding-left: 20px; margin: 32px 0;
}

/* ============ NEWSLETTER ============ */

.newsletter {
  margin-top: 60px; padding: 80px 0;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: radial-gradient(800px 400px at 20% 50%, rgba(225,37,27,0.06), transparent 60%), var(--bg);
}
.newsletter-inner { display: grid; grid-template-columns: 1.2fr 1fr; gap: 64px; align-items: center; }
@media (max-width: 920px) { .newsletter-inner { grid-template-columns: 1fr; gap: 24px; } }
.newsletter h2 {
  font-family: "Anton", sans-serif; font-size: clamp(40px, 6vw, 84px);
  line-height: 0.88; text-transform: uppercase; letter-spacing: -0.01em;
}
.newsletter h2 em { font-style: normal; color: var(--accent); }
.newsletter p { margin-top: 16px; color: var(--fg-dim); max-width: 480px; }
.newsletter form { display: flex; border: 1px solid var(--line-2); }
.newsletter input {
  flex: 1; background: transparent; border: 0;
  padding: 18px 20px; color: var(--fg); font: inherit; font-size: 15px; outline: none;
}
.newsletter input::placeholder { color: var(--fg-dimmer); }
.newsletter button[type="submit"] {
  padding: 0 28px; background: var(--fg); color: var(--bg);
  font-family: "Archivo", sans-serif; font-weight: 700;
  font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  transition: background 0.2s ease;
}
.newsletter button[type="submit"]:hover { background: var(--accent); color: #fff; }
.newsletter .agree {
  margin-top: 12px; display: flex; gap: 8px; align-items: center;
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  letter-spacing: 0.12em; color: var(--fg-dim); text-transform: uppercase;
}
.newsletter .ok-state {
  padding: 18px 20px;
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ok);
}

/* ============ INSTAGRAM ============ */

.ig { padding: 80px 0; }
.ig-grid {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 1px; background: var(--line); border: 1px solid var(--line);
}
@media (max-width: 920px) { .ig-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 480px) { .ig-grid { grid-template-columns: repeat(2, 1fr); } }
.ig-tile { aspect-ratio: 1/1; background: var(--bg-2); overflow: hidden; position: relative; }

<script type="text/babel">
/* tweaks-panel — painel interno, só ativo no Claude.ai */
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .15s,width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;border-radius:6px;cursor:default;padding:4px 6px}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-chips{display:flex;gap:6px}
  .twk-chip{position:relative;appearance:none;flex:1;min-width:0;height:46px;padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);transition:transform .12s,box-shadow .12s}
  .twk-chip:hover{transform:translateY(-1px);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.15)}
  .twk-chip>span{position:absolute;top:0;bottom:0;right:0;width:34%;display:flex;flex-direction:column}
  .twk-chip>span>i{flex:1}
  .twk-chip svg{position:absolute;top:6px;left:6px;width:13px;height:13px}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  React.useEffect(() => {
    const onMsg = (e) => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd"><b>{title}</b><button className="twk-x" onClick={() => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); }}>✕</button></div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}
function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRow({ label, children, inline = false }) {
  return <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}><div className="twk-lbl"><span>{label}</span></div>{children}</div>;
}
function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} role="switch" aria-checked={!!value} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}
function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const trackRef = React.useRef(null);
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" className="twk-seg">
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => <button key={o.value} type="button" role="radio" aria-checked={o.value === value} onClick={() => onChange(o.value)}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}
function TweakColor({ label, value, options, onChange }) {
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" data-on={on ? '1' : '0'} style={{ background: hero }} onClick={() => onChange(o)}>
              {rest.length > 0 && <span>{rest.map((c, j) => <i key={j} style={{ background: c }} />)}</span>}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}
Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakToggle, TweakRadio, TweakColor });
</script>

function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { rootMargin:"0px 0px -10% 0px", threshold:0.05 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function useLockBody(locked) {
  useEffect(() => {
    if (locked) {
      const prev = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      return () => { document.body.style.overflow = prev; };
    }
  }, [locked]);
}

    const onKey = e => {

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [cartOpen, setCartOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [pdp, setPdp] = useState(null);
  const [items, setItems] = useState([]);

  useScrollReveal();

  useEffect(() => { document.documentElement.style.setProperty("--accent", t.accent); }, [t.accent]);

  const addToCart = useCallback((p, size) => {
    const key = `${p.id}-${size}`;
    setItems(prev => {
      const existing = prev.find(it=>it.key===key);
      if (existing) return prev.map(it=>it.key===key?{...it,qty:it.qty+1}:it);
      return [...prev,{key,id:p.id,name:p.name,sku:p.sku,price:p.price,size,color:p.color,img:p.images[0],qty:1}];
    });
    setCartOpen(true);
  }, []);

  const changeQty = (key,delta) => setItems(prev=>prev.map(it=>it.key===key?{...it,qty:Math.max(1,it.qty+delta)}:it));
  const removeItem = (key) => setItems(prev=>prev.filter(it=>it.key!==key));
  const cartCount = items.reduce((s,it)=>s+it.qty,0);

  return (
    <>
      {t.showMarquee && <Marquee />}
      <Nav cartCount={cartCount} onCart={()=>setCartOpen(true)} onMenu={()=>setMenuOpen(true)} />
      <MobileMenu open={menuOpen} onClose={()=>setMenuOpen(false)} />
      <Hero heroImage={t.heroImage} />
      <FeaturedSection onAdd={addToCart} onOpen={setPdp} density={t.gridDensity} />
      <Lookbook onOpen={setPdp} />
      <Catalog onAdd={addToCart} onOpen={setPdp} />
      <Manifesto />
      <Newsletter />
      <Instagram />
      <Footer />
      <CartDrawer open={cartOpen} items={items} onClose={()=>setCartOpen(false)} onChange={changeQty} onRemove={removeItem} />
      <ProductModal product={pdp} onClose={()=>setPdp(null)} onAdd={addToCart} />
      <TweaksPanel title="Tweaks">
        <TweakSection label="Cor de destaque" />
        <TweakColor label="Accent" value={t.accent} onChange={v=>setTweak("accent",v)} options={["#e1251b","#cfcfd1","#f5f5f5","#ff5e1f","#2a2a2a"]} />
        <TweakSection label="Layout" />
        <TweakRadio label="Grid" value={t.gridDensity} onChange={v=>setTweak("gridDensity",v)} options={[{value:"3",label:"3 col"},{value:"4",label:"4 col"}]} />
        <TweakToggle label="Marquee" value={t.showMarquee} onChange={v=>setTweak("showMarquee",v)} />
        <TweakSection label="Hero" />
        <TweakRadio label="Imagem" value={t.heroImage} onChange={v=>setTweak("heroImage",v)} options={[{value:"neon",label:"Neon"},{value:"sintetizador",label:"Synth"},{value:"cinema",label:"Cinema"},{value:"spray",label:"Spray"}]} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
